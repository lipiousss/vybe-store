services:
  postgres:
    image: mirror.gcr.io/library/postgres:16-alpine
    container_name: vybe-postgres-prod
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vybe_store}
      POSTGRES_USER: ${POSTGRES_USER:-vybe}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production}
    volumes:
      - vybe_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vybe} -d ${POSTGRES_DB:-vybe_store}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vybe-backend-prod
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      HOST: 0.0.0.0
      DATABASE_URL: postgresql://${POSTGRES_USER:-vybe}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production}@postgres:5432/${POSTGRES_DB:-vybe_store}?schema=public
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env.production}
      CLIENT_URL: ${CLIENT_URL:?Set CLIENT_URL in .env.production}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      RUN_SEED_ON_START: ${RUN_SEED_ON_START:-false}
      RUN_SEED_FORCE: ${RUN_SEED_FORCE:-false}
      SEED_FORCE: ${SEED_FORCE:-false}
    volumes:
      - ./backend/uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.production
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
    container_name: vybe-frontend-prod
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    depends_on:
      - backend

  pgadmin:
    image: dpage/pgadmin4:8
    container_name: vybe-pgadmin-prod
    restart: unless-stopped
    profiles:
      - tools
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@vybe.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:?Set PGADMIN_DEFAULT_PASSWORD in .env.production}
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    volumes:
      - vybe_pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  vybe_postgres_data:
  vybe_pgadmin_data:
